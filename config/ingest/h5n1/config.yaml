segment_identification:
  method: align
  # Every segment is listed in nextclade_dataset_name_map below, so this prefix is
  # never used. It must still be set: the ingest Snakefile builds the per-segment
  # fallback (nextclade_dataset_name + "/" + segment) as an eagerly evaluated
  # dict.get() default, which raises a TypeError on None even when the map matches.
  nextclade_dataset_name: unused
  nextclade_dataset_name_map:
    seg1: nextstrain/flu/h1n1pdm/pb2
    seg2: nextstrain/flu/h1n1pdm/pb1
    seg3: nextstrain/flu/h1n1pdm/pa
    seg4: community/moncla-lab/iav-h5/ha/all-clades
    seg5: nextstrain/flu/h1n1pdm/np
    seg6: nextstrain/flu/h1n1pdm/na
    seg7: nextstrain/flu/h1n1pdm/mp
    seg8: nextstrain/flu/h1n1pdm/ns
  nextclade_dataset_server: https://data.clades.nextstrain.org/v3
# 102793 is the NCBI "H5N1 subtype" node; taxon queries are subtree-inclusive, so this
# pulls every H5N1 strain taxon beneath it (~31k sequences) and needs no extra filtering.
# It deliberately is not 197911 (the Alphainfluenzavirus genus): that is all ~1.6M
# influenza A sequences, a download NCBI aborts and a nextclade run this host cannot do.
# Caveat: NCBI stopped filing new influenza submissions under subtype nodes, so this
# subtree is mostly pre-2020. See README for how to widen the H5N1 scope.
taxon_id: 102793
nucleotide_sequences:
- seg1
- seg2
- seg3
- seg4
- seg5
- seg6
- seg7
- seg8
verify_loculus_version_is: commit-52e855d
check_ena_deposition: false
organism: h5n1
backend_url: http://backend:8079
keycloak_token_url: http://keycloak:8080/realms/loculus/protocol/openid-connect/token
rename:
  country: geoLocCountry
  division: geoLocAdmin1
  genbankAccession: insdcAccessionFull
  ncbiCollectionDate: sampleCollectionDate
  ncbiHostName: hostNameScientific
  ncbiHostTaxId: hostTaxonId
  ncbiIsLabHost: isLabHost
  ncbiIsolateName: specimenCollectorSampleId
  ncbiSubmitterAffiliation: authorAffiliations
  ncbiSubmitterNames: authors
insdc_segment_specific_fields:
- insdcAccessionBase
- insdcAccessionFull
- insdcVersion
- ncbiUpdateDate
